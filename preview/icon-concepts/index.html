<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Universal Character Sheet logo</title>
    <style>
      :root {
        color: #171717;
        background: #ece8df;
        font-family: Georgia, 'Times New Roman', serif;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        padding: 48px 24px;
        background:
          linear-gradient(90deg, rgba(23, 23, 23, .035) 1px, transparent 1px),
          linear-gradient(rgba(23, 23, 23, .035) 1px, transparent 1px),
          #ece8df;
        background-size: 24px 24px;
      }

      main { max-width: 1056px; margin: 0 auto; }
      h1 { margin: 0 0 8px; font-size: 32px; font-weight: 500; }
      header p { margin: 0 0 32px; color: #595650; font: 15px/1.5 Consolas, monospace; }

      .concepts {
        display: grid;
        grid-template-columns: minmax(0, 352px);
        gap: 16px;
      }

      article {
        overflow: hidden;
        border: 1px solid #b7b0a5;
        border-radius: 6px;
        background: #f8f5ee;
      }

      .hero {
        display: grid;
        min-height: 260px;
        place-items: center;
        background-color: #ddd8ce;
        background-image:
          linear-gradient(45deg, #c9c3b8 25%, transparent 25%),
          linear-gradient(-45deg, #c9c3b8 25%, transparent 25%),
          linear-gradient(45deg, transparent 75%, #c9c3b8 75%),
          linear-gradient(-45deg, transparent 75%, #c9c3b8 75%);
        background-position: 0 0, 0 10px, 10px -10px, -10px 0;
        background-size: 20px 20px;
      }

      .hero img { width: 168px; height: 168px; }
      .details { padding: 18px; }
      h2 { margin: 0 0 6px; font-size: 21px; font-weight: 600; }
      .details p { min-height: 42px; margin: 0; color: #676159; font: 13px/1.55 Consolas, monospace; }

      .sizes {
        display: flex;
        align-items: center;
        gap: 18px;
        min-height: 92px;
        margin-top: 18px;
        padding: 12px;
        border: 1px solid #d1cbc0;
        background: linear-gradient(90deg, #fff 0 50%, #282624 50%);
      }

      .sizes img:nth-child(1) { width: 48px; height: 48px; }
      .sizes img:nth-child(2) { width: 32px; height: 32px; }
      .sizes img:nth-child(3) { width: 24px; height: 24px; margin-left: auto; }

      @media (max-width: 760px) {
        body { padding: 28px 16px; }
        .concepts { grid-template-columns: 1fr; }
        .hero { min-height: 220px; }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Universal Character Sheet</h1>
        <p>Official transparent logo at 168, 48, 32, and 24 pixels.</p>
      </header>
      <section class="concepts">
        <article>
          <div class="hero"><img src="faceted-u.svg" alt="Faceted U icon" /></div>
          <div class="details">
            <h2>Faceted U</h2>
            <p>A geometric U ending in a die-like point for the tabletop angle.</p>
            <div class="sizes"><img src="faceted-u.svg" alt="" /><img src="faceted-u.svg" alt="" /><img src="faceted-u.svg" alt="" /></div>
          </div>
        </article>
      </section>
    </main>
  </body>
</html>
